# Committed on purpose: connection values come only from environment variables
# (see .env.example). Never put literal hosts, paths or tokens here.
corvella:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      # corvella_dev unless DBT_CATALOG says otherwise. There is no prod output:
      # only prod jobs, deployed by CD, write to corvella_prod.
      catalog: "{{ env_var('DBT_CATALOG', 'corvella_dev') }}"
      schema: smoke_test
      threads: 4
    # CI only (dbt build --target ci): logs in as the corvella-ci service
    # principal with OAuth, from GitHub Actions secrets. Never used locally.
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      catalog: corvella_dev
      schema: smoke_test
      threads: 4
