# Committed on purpose: connection values come only from environment variables
# (see .env.example). Never put literal hosts, paths or tokens here.
corvella:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: corvella
      schema: smoke_test
      threads: 4
